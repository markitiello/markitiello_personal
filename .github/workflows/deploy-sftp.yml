name: Deploy to SFTP

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-sftp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
      SFTP_USER: ${{ secrets.SFTP_USER }}
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          HAS_KEY: ${{ secrets.SFTP_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.SFTP_PASSWORD != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS != '' }}
        run: |
          missing=0
          for v in SFTP_HOST SFTP_USER SFTP_REMOTE_DIR; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          if [ "$HAS_KNOWN_HOSTS" != "true" ]; then echo "::error::Missing secret SFTP_KNOWN_HOSTS"; missing=1; fi
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_PASSWORD" != "true" ]; then
            echo "::error::Set SFTP_PRIVATE_KEY (recommended) or SFTP_PASSWORD"; missing=1
          fi
          exit $missing

      - name: Prepare site
        # Only public files are uploaded: never .git, .github or other repo files.
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Configure SSH
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ -n "$SFTP_PRIVATE_KEY" ]; then
            printf '%s\n' "$SFTP_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Upload via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          ssh_opts="ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          if [ -f ~/.ssh/deploy_key ]; then
            ssh_opts="$ssh_opts -o IdentitiesOnly=yes -i $HOME/.ssh/deploy_key"
            auth=(-u "$SFTP_USER,")
          else
            auth=(-u "$SFTP_USER" --env-password)
          fi
          lftp "${auth[@]}" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm no
          set sftp:connect-program "$ssh_opts"
          mirror --reverse --verbose --only-newer --no-perms --exclude-glob .* _site/ "$SFTP_REMOTE_DIR"
          bye
          LFTP

      - name: Clean up credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key
